# Target-specific link flags for mobile native builds.
# Android: Google Play 16 KB page-size requirement (ELF LOAD align ≥ 2**14).
# Applied whenever cargo builds android targets (`just expo-android`).
#
# NDK linker configuration is handled by scripts/build-native-android.sh,
# which sets CC_<target> and CARGO_TARGET_<TARGET>_LINKER env vars.

[target.aarch64-linux-android]
rustflags = [
  "-C", "link-arg=-Wl,-z,max-page-size=16384",
  "-C", "link-arg=-Wl,-z,common-page-size=16384",
]

[target.x86_64-linux-android]
rustflags = [
  "-C", "link-arg=-Wl,-z,max-page-size=16384",
  "-C", "link-arg=-Wl,-z,common-page-size=16384",
]

[target.armv7-linux-androideabi]
rustflags = [
  "-C", "link-arg=-Wl,-z,max-page-size=16384",
  "-C", "link-arg=-Wl,-z,common-page-size=16384",
]

[target.i686-linux-android]
rustflags = [
  "-C", "link-arg=-Wl,-z,max-page-size=16384",
  "-C", "link-arg=-Wl,-z,common-page-size=16384",
]
