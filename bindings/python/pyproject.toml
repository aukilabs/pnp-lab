[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "aukilabs-pnplab"
version = "0.1.0"
description = "Perspective-n-Point pose estimation powered by PnPLab"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Auki Labs" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/aukilabs/pnplab"

[tool.maturin]
bindings = "pyo3"
module-name = "auki_pnplab._native"
python-source = "python"
strip = true

[tool.pytest.ini_options]
testpaths = ["tests"]
