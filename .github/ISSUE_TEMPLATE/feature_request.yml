name: Feature request
description: Propose an API, solver, or binding change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: For large features or public API changes, open an issue before starting implementation. See [CONTRIBUTING.md](https://github.com/aukilabs/pnp-lab/blob/develop/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is awkward or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behavior you want, including coordinate-frame implications if you know them.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - pnp-core (Rust)
        - C FFI
        - Python
        - WASM
        - Expo / React Native
        - Docs
        - Other
    validations:
      required: true
