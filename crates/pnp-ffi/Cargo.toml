[package]
name = "pnp-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "C FFI bindings for PnP pose estimation"

[lib]
name = "pnp_ffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# no default features: avoids nalgebra/std which pulls in matrixmultiply + simba/wide
pnp-core = { workspace = true }

[build-dependencies]
cbindgen = "0.27"
