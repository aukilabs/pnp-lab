[package]
name = "pnp-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure Rust Perspective-n-Point (PnP) pose estimation with optional distortion"
readme = "../../README.md"
keywords = ["pnp", "pose", "computer-vision", "ar", "calibration"]
categories = ["algorithms", "computer-vision", "no-std", "science"]

[features]
default = ["std"]
std = ["nalgebra/std"]

[dependencies]
nalgebra = { version = "0.33", default-features = false, features = ["alloc", "libm"] }
libm = "0.2"

[dev-dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.8"
